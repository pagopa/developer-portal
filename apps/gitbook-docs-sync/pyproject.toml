[project]
name = "gitbook-docs-sync"
version = "0.1.0"
description = "Synchronize GitBook documentation and metadata to S3"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.42.54,<2",
  "pydantic-settings>=2.13.1,<3",
]

[dependency-groups]
test = [
  "pytest>=8.3.5,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
